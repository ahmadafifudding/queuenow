# nginx config for the QueueNow web SPA.
# All non-asset paths fall back to index.html so client-side (TanStack Router)
# routes like /display/:orgId, /kiosk/:orgId, /track/:orgId/:ticketId work on
# direct load / refresh.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets; never cache the HTML entry.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
